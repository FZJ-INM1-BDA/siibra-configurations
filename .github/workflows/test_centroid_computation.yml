name: '[test] test compute centroids'

on:
  push:
    branches: ["**"]
    paths:
    - 'maps/**'
  workflow_dispatch:
    inputs:
      siibra_python_ref:
        description: 'siibra-python branch, tag or sha to use'
        required: false
        default: 'main'
        type: string
      all_maps:
        description: 'compute centroids of all maps (otherwise a random sample)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_compute_centroids:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - id: siibra
      uses: ./.github/actions/setup-siibra-python
      with:
        siibra-python-ref: ${{ inputs.siibra_python_ref || 'main' }}

    - name: check if centroids can be calculated for all maps
      working-directory: ${{ steps.siibra.outputs.siibra-python-dir }}
      env:
        # siibra-python tests a random sample of 3 maps unless TEST_ALL_MAPS
        # is set. test all maps when map configurations change
        TEST_ALL_MAPS: 'true'
      run: pytest -rx e2e/volumes/test_compute_centroids.py
