name: '[mirror] push to mirror'

on:
  push:
    branches: ["master"]
    tags: ["**"]

permissions:
  contents: read

env:
  EBRAINS_GITLAB_REPO: ri/tech-hub/apps/siibra/siibra-configurations-mirror.git

jobs:
  # n.b. we use access token, rather than https://github.com/valtech-sd/git-sync
  # because it does not seem possible to add project wide ssh key
  # and using personal key is not very feasible
  push_to_mirror:
    if: ${{ vars.EBRAINS_GITLAB_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: mirror to remote
      env:
        EBRAINS_GITLAB_HOST: ${{ vars.EBRAINS_GITLAB_HOST }}
        EBRAINS_GITLAB_PUSH_TOKEN: ${{ secrets.EBRAINS_GITLAB_PUSH_TOKEN }}
      # Push to the URL directly instead of adding a remote, so the token is
      # never written to .git/config.
      run: |
        git fetch --tags -f
        git fetch origin master
        MIRROR_URL="https://jugitpusher:${EBRAINS_GITLAB_PUSH_TOKEN}@${EBRAINS_GITLAB_HOST}/${EBRAINS_GITLAB_REPO}"
        git push "$MIRROR_URL" --tags -f
        git push "$MIRROR_URL" HEAD:master -f
