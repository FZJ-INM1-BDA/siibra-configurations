name: '[ci] release-checklist'

on:
  push:
    tags: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  RELEASE_CHECKLIST_TAG: release checklist
  REPO: ${{ github.repository }}
  ACTOR: ${{ github.actor }}
  TAG_NAME: ${{ github.ref_name }}

jobs:

  sanity-check:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Check tag does not contain slash
      run: |
        if [[ "$TAG_NAME" == */* ]]; then
          echo "::error::Tag '$TAG_NAME' must not contain '/'"
          exit 1
        fi

  get-all-opened:
    runs-on: ubuntu-latest
    needs:
    - sanity-check
    permissions:
      issues: read
    outputs:
      OPEN_RELEASE_ISSUES: ${{ steps.get-all-issues.outputs.ALL_ISSUES }}
    steps:
    - name: Get all open issues labelled '${{ env.RELEASE_CHECKLIST_TAG }}'
      id: get-all-issues
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        issues=$(gh issue list \
          --repo "$REPO" \
          --label "$RELEASE_CHECKLIST_TAG" \
          --json 'id,body,number,url,title' \
          --jq 'tojson')
        echo "Found: $issues"
        echo "ALL_ISSUES=$issues" >> "$GITHUB_OUTPUT"

  # For each open checklist: fill in the released tag, thank the releaser
  # (asking to double check if the validation table was not filled in), close.
  finalise-existing:
    runs-on: ubuntu-latest
    needs:
    - get-all-opened
    permissions:
      issues: write
    steps:
    - name: Update, comment on and close open release checklists
      env:
        GH_TOKEN: ${{ github.token }}
        OPEN_RELEASE_ISSUES: ${{ needs.get-all-opened.outputs.OPEN_RELEASE_ISSUES }}
      run: |
        jq -c '.[]' <<< "$OPEN_RELEASE_ISSUES" > issues.jsonl
        while IFS= read -r -u 3 issue; do
          url=$(jq -r '.url' <<< "$issue")
          echo "::group::$url"

          # first line links to compare/<previous tag>...master -> ...<new tag>
          jq -r --arg tag "$TAG_NAME" \
            '.body | split("\n") | .[0] |= sub("master"; $tag) | join("\n")' \
            <<< "$issue" > body.md
          new_title=$(jq -r --arg tag "$TAG_NAME" '.title | sub("v\\?\\?\\?"; $tag)' <<< "$issue")
          echo "new title: $new_title"
          gh issue edit "$url" --title "$new_title" --body-file body.md

          comment="Thank you @$ACTOR for the release."
          if jq -r '.body' <<< "$issue" | grep -Fq '<person name>'; then
            comment+=$'\n\n'"Can you double check you have validated the release? The validation table still contains the template placeholders."
          fi
          gh issue comment "$url" --body "$comment"

          gh issue close "$url" --reason completed
          echo "::endgroup::"
        done 3< issues.jsonl

  open-new:
    runs-on: ubuntu-latest
    needs:
    - get-all-opened
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Open release checklist for the next release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        jq -Rrs --arg tag "$TAG_NAME" \
          'split("\n") | .[0] |= sub("LATEST_TAG_PLACEHOLDER"; $tag) | join("\n")' \
          release_checklist.md > body.md
        cat body.md
        gh issue create \
          --repo "$REPO" \
          --label "$RELEASE_CHECKLIST_TAG" \
          --title '[release checklist] v???' \
          --body-file body.md
