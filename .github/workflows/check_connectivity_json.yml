name: '[test] check connectivity'

on:
  pull_request:
    paths:
    - 'features/connectivity/**/*.json'
  workflow_dispatch:
    inputs:
      siibra_python_ref:
        description: 'siibra-python branch, tag or sha to use'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_connectivity_json:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - id: siibra
      uses: ./.github/actions/setup-siibra-python
      with:
        siibra-python-ref: ${{ inputs.siibra_python_ref || 'main' }}

    - name: connectivity e2e test
      working-directory: ${{ steps.siibra.outputs.siibra-python-dir }}
      run: pytest -rx e2e/features/connectivity/test_connectivity.py
