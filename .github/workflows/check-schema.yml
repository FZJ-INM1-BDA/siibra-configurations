name: '[test] check schema'

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      siibra_python_branch:
        description: 'siibra-python branch, tag or sha to use'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_schema:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout siibra-configurations
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: siibra-configurations
        persist-credentials: false

    # On push there are no inputs, so fall back to main explicitly rather than
    # relying on an empty ref resolving to the default branch.
    - name: Checkout siibra-python
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: FZJ-INM1-BDA/siibra-python
        ref: ${{ inputs.siibra_python_branch || 'main' }}
        path: siibra-python
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        check-latest: true

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r siibra-python/config_schema/requirements.txt

    - name: Check schema
      run: python siibra-python/config_schema/check_schema.py siibra-configurations
