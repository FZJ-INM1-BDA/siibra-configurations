name: '[test] test configuration'

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # add new test scripts here
      matrix:
        include:
        - name: check_jsons
          script: verify_json.py
        - name: check_ebrains_id
          script: verify_ebrains_ids.py
        - name: region_attr_compliance
          script: region_attr_compliance.py
        - name: check_map_volume_idx
          script: verify_volume_idx.py
        - name: check_maps
          script: verify_maps.py
        - name: check_neuroglancer_urls
          script: verify_neuroglancer_urls.py
        - name: ensure_no_duplicated_region_name
          script: ensure_no_duplicated_region_name.py
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r _ci/requirements.txt
    - name: Run _ci/${{ matrix.script }}
      env:
        SCRIPT: ${{ matrix.script }}
      run: python "_ci/$SCRIPT"
