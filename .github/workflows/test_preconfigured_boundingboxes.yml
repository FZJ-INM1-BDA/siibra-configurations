name: '[test] test preconfigured bounding boxes'

on:
  push:
    branches: ["**"]
    paths:
    - 'maps/**'
    - 'features/images/**'
  workflow_dispatch:
    inputs:
      siibra_python_ref:
        description: 'siibra-python branch, tag or sha to use'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_preconfigured_boundingboxes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - id: siibra
      uses: ./.github/actions/setup-siibra-python
      with:
        siibra-python-ref: ${{ inputs.siibra_python_ref || 'main' }}

    - name: check all preconfigured bounding boxes
      working-directory: ${{ steps.siibra.outputs.siibra-python-dir }}
      env:
        TEST_ALL_PRECONF_BBOXES: 'true'
      run: pytest -rx e2e/volumes/test_preconfigured_boundingbox.py
